<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">Paper analyzer workflow</title>
  <desc id="desc">Workflow from ACM DOI, paper title, or local PDF to validated Chinese Obsidian paper notes with extracted figures.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1d2a44" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 1 1 L 11 6 L 1 11 z" fill="#4f6f9f"/>
    </marker>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 26px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #5c667a; }
      .card { fill: url(#panel); stroke: #d8e2f2; stroke-width: 1.2; rx: 18; filter: url(#shadow); }
      .cardTitle { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .body { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #566176; }
      .chip { fill: #eaf1ff; stroke: #cad8ef; stroke-width: 1; rx: 12; }
      .chipText { font: 600 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #35537d; }
      .line { stroke: #4f6f9f; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .icon { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #49668f; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="360"/>
  <text class="title" x="44" y="48">Claude Code Paper Analyzer Skills</text>
  <text class="subtitle" x="44" y="75">From ACM DOI, paper title, or local PDF to validated Chinese Obsidian notes with reliable figure extraction.</text>

  <rect class="card" x="44" y="118" width="190" height="154"/>
  <text class="icon" x="70" y="153">1</text>
  <text class="cardTitle" x="70" y="184">Input</text>
  <text class="body" x="70" y="211">DOI, title, ACM URL,</text>
  <text class="body" x="70" y="232">or local PDF folder</text>
  <rect class="chip" x="70" y="246" width="104" height="26"/>
  <text class="chipText" x="84" y="264">Slash command</text>

  <path class="line" d="M 246 195 C 266 195, 276 195, 298 195"/>

  <rect class="card" x="310" y="118" width="190" height="154"/>
  <text class="icon" x="336" y="153">2</text>
  <text class="cardTitle" x="336" y="184">Acquire PDF</text>
  <text class="body" x="336" y="211">Selenium for ACM,</text>
  <text class="body" x="336" y="232">ArXiv fallback, or file</text>
  <rect class="chip" x="336" y="246" width="106" height="26"/>
  <text class="chipText" x="350" y="264">Cloudflare aware</text>

  <path class="line" d="M 512 195 C 532 195, 542 195, 564 195"/>

  <rect class="card" x="576" y="118" width="190" height="154"/>
  <text class="icon" x="602" y="153">3</text>
  <text class="cardTitle" x="602" y="184">Analyze</text>
  <text class="body" x="602" y="211">markitdown text,</text>
  <text class="body" x="602" y="232">validated figure crops</text>
  <rect class="chip" x="602" y="246" width="116" height="26"/>
  <text class="chipText" x="616" y="264">No blank crops</text>

  <path class="line" d="M 778 195 C 798 195, 808 195, 830 195"/>

  <rect class="card" x="842" y="118" width="234" height="154"/>
  <text class="icon" x="868" y="153">4</text>
  <text class="cardTitle" x="868" y="184">Obsidian Note</text>
  <text class="body" x="868" y="211">Chinese analysis, YAML,</text>
  <text class="body" x="868" y="232">figures, scoring, validator</text>
  <rect class="chip" x="868" y="246" width="126" height="26"/>
  <text class="chipText" x="882" y="264">Ready for vault</text>

  <text class="subtitle" x="44" y="322">Bundled scripts keep the fragile parts deterministic: crop detection, white-image skipping, markdown image checks, YAML checks.</text>
</svg>
